<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Don't have an account</title>
  <link rel="stylesheet" href="styles/sign.css">
</head>
<body>
  <header>

  </header>

  <div class="container">
    <form action="">
      <h1 class="text">Create an account</h1>
      <div class="details">
          <label for="name">Name :</label>
        <input 
        id="name" 
        type="text" 
        placeholder="e.g; Joshua" 
        required>
      </div>
      <div class="details">
        <label for="email">Email :</label>
        <input 
        id="email" 
        type="email" 
        placeholder="e.g; josh123@gmail.com" 
        required>
      </div>
      <div class="details">
        <label for="phone">Phone Number :</label>
        <input 
        id="phone" 
        type="tel" 
        placeholder="e.g; 0801 111 1111"
        required>
      </div>
      <div class="details">
        <label for="password">Password :</label>
        <input 
        id="password" 
        type="password" 
        placeholder="Enter your Password"
        required>
      </div>
      <div class="details">
        <label for="c-password">Confirm Passsword :</label>
        <input 
        id="c-password" 
        type="password" 
        placeholder="Confirm your Password"
        required>
      </div>
      <div class="text">
        <input type="checkbox" required>
        <label class="agree" for="agree">I have read and agreed to all the 
        <a href="#">privacy policy</a>   and
        <a href="#">terms and conditions</a> </label>
      </div>
      <div class="text">
        <button type="submit">
          Sign Up
        </button>
      </div>
      
      <p class="text">
        You have an account. 
        <a class="link" href="login.html">Login</a>
      </p>
    </form>
  </div>
</body>
</html>
